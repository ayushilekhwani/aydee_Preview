<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AYDEE Official | Premium Plus Size Chikankari Suits &amp; Co-ord Sets</title>
<meta name="description" content="Hand-embroidered Chikankari kurta sets, Kashmiri co-ords and festive wear in sizes M to 11XL. Dispatch in 24 hours, free shipping across India. Rated 4.94★ by 84 verified customers.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="https://theofficialaydee.com/cdn/shop/files/sticker-01-removebg-preview.png?v=1748544343&width=64">
<link rel="preconnect" href="https://cdn.shopify.com"><link rel="preconnect" href="https://theofficialaydee.com">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#2a2a2a;--cream:#ECE8DF;--cream2:#F8F6F2;--paper:#fff;--line:#E2DCD0;--muted:#6f6a61;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Poppins',system-ui,-apple-system,sans-serif;--wrap:1320px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.5;padding-bottom:64px}
@media(min-width:990px){body{padding-bottom:0}}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
@media(min-width:990px){.wrap{padding:0 40px}}
.serif{font-family:var(--serif)}
.up{text-transform:uppercase;letter-spacing:.14em}

/* announcement — rotating, like the reference */
.ann{background:var(--ink);color:var(--cream);height:34px;overflow:hidden;position:relative;font-size:12px;letter-spacing:.08em}
.ann div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;opacity:0;animation:annr 20s infinite;padding:0 12px;text-align:center}
.ann div:nth-child(2){animation-delay:4s}.ann div:nth-child(3){animation-delay:8s}.ann div:nth-child(4){animation-delay:12s}.ann div:nth-child(5){animation-delay:16s}
@keyframes annr{0%{opacity:0;transform:translateY(8px)}3%,18%{opacity:1;transform:none}21%,100%{opacity:0;transform:translateY(-8px)}}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:62px}
.hrow .l,.hrow .r{display:flex;align-items:center;gap:2px}
.hrow .r{justify-content:flex-end}
.logo img{height:50px;width:auto}
.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ic svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.5}
.nav{display:none}
@media(min-width:990px){.hrow{height:84px}.logo img{height:64px}.menu-btn{display:none!important}
 .nav{display:flex;justify-content:center;gap:34px;height:46px;align-items:center;border-top:1px solid var(--line);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
 .nav>div{position:relative;height:100%;display:flex;align-items:center}
 .nav a{padding:4px 0;border-bottom:1.5px solid transparent}.nav a:hover,.nav a.on{border-color:var(--ink)}
 .nav .dd{display:none;position:absolute;top:100%;left:-20px;background:var(--paper);border:1px solid var(--line);padding:14px 22px;min-width:240px;text-transform:none;letter-spacing:0;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.08)}
 .nav .dd a{display:block;padding:7px 0;border:0}.nav>div:hover .dd{display:block}}
/* category chip bar under header (mobile) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;border-top:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:0 0 auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-weight:500}
.chips a.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
@media(min-width:990px){.chips{display:none}}

/* drawer */
.drw{position:fixed;inset:0;z-index:90;visibility:hidden}
.drw.open{visibility:visible}
.drw .sc{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:.25s}
.drw.open .sc{opacity:1}
.drw .pn{position:absolute;left:0;top:0;bottom:0;width:min(86vw,380px);background:var(--paper);transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column;overflow:auto}
.drw.open .pn{transform:none}
.drw .pt{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.drw nav a,.drw summary{display:flex;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;list-style:none;cursor:pointer}
.drw summary::-webkit-details-marker{display:none}
.drw details a{padding-left:34px;text-transform:none;letter-spacing:0;font-weight:400;background:var(--cream2)}
.drw .pf{margin-top:auto;padding:18px 20px;font-size:13px;color:var(--muted);background:var(--cream2)}

/* hero slider */
.hero{position:relative;background:var(--cream)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides a{flex:0 0 100%;scroll-snap-align:start}
.slides img{width:100%;height:auto;min-height:200px;object-fit:cover;background:var(--cream)}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid var(--ink)}
.dots button.on{background:var(--ink);width:22px;border-radius:6px}
.harr{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.85);display:none;place-items:center}
.harr svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
@media(min-width:990px){.harr{display:grid}}

/* section heads */
.sec{padding:44px 0}
@media(min-width:990px){.sec{padding:64px 0}}
.sh{text-align:center;margin-bottom:22px}
.sh h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,6vw,44px);line-height:1.1}
.sh p{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.04em}
.sh .va{display:inline-block;margin-top:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid var(--ink);font-weight:500}

/* shop by category — circles */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px}
@media(min-width:990px){.cats{grid-template-columns:repeat(8,1fr);gap:24px}}
.cat{text-align:center;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;line-height:1.3}
.cat span.c{display:block;aspect-ratio:1;border-radius:50%;overflow:hidden;margin-bottom:8px;background:var(--cream);border:1px solid var(--line)}
.cat img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}
.cat:hover img{transform:scale(1.06)}

/* USP ticker */
.usp{background:var(--cream);border-block:1px solid var(--line);overflow:hidden;white-space:nowrap}
.usp .t{display:inline-flex;gap:56px;padding:14px 0;animation:mq 30s linear infinite;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.usp span::before{content:'✦';margin-right:14px}
@keyframes mq{to{transform:translateX(-50%)}}

/* product rail + grid */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 16px;margin:0 -16px;scroll-padding:0 16px}
.rail::-webkit-scrollbar{display:none}
.rail>.pc{flex:0 0 46%;scroll-snap-align:start}
@media(min-width:700px){.rail>.pc{flex-basis:30%}}
@media(min-width:990px){.rail{margin:0;padding:0;gap:20px}.rail>.pc{flex-basis:calc(25% - 15px)}}
.rwrap{position:relative}
.rwrap .harr{z-index:3;top:38%}
.rwrap .prev{left:-14px}.rwrap .next{right:-14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:990px){.grid{grid-template-columns:repeat(4,1fr);gap:34px 20px}}
.pc{display:flex;flex-direction:column}
.pc .im{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;background:var(--cream)}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s,transform .8s}
.pc .im img.b{opacity:0}
@media(hover:hover){.pc:hover .im img.b{opacity:1}.pc:hover .im img.a{transform:scale(1.03)}}
.bdg{position:absolute;left:0;top:10px;z-index:2;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.bdg span{background:var(--paper);color:var(--ink);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;font-weight:600}
.bdg span.d{background:var(--ink);color:var(--cream)}
.bdg span.so{background:#8a8378;color:#fff}
.ship{margin-top:10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.pc h3{font-size:13.5px;font-weight:400;line-height:1.4;margin:6px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pr s{color:var(--muted);font-weight:400;font-size:12.5px}
.pr em{font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.04em}
.szs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 10px}
.szs i{font-style:normal;font-size:10.5px;border:1px solid var(--line);padding:2px 6px;color:var(--ink2)}
.pc .cta{margin-top:auto;display:flex;align-items:center;justify-content:center;height:40px;border:1px solid var(--ink);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;transition:.2s}
.pc .cta:hover{background:var(--ink);color:var(--cream)}
.more{display:flex;justify-content:center;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 34px;background:var(--ink);color:var(--cream);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid var(--ink);transition:.2s}
.btn:hover{background:var(--ink2)}
.btn.o{background:transparent;color:var(--ink)}
.btn.o:hover{background:var(--ink);color:var(--cream)}
.btn.c{background:var(--cream);color:var(--ink);border-color:var(--cream)}

/* spotlight two-up */
.duo{display:grid;gap:12px}
@media(min-width:760px){.duo{grid-template-columns:1fr 1fr;gap:20px}}
.spot{position:relative;display:block;overflow:hidden;aspect-ratio:4/5;background:var(--cream)}
.spot img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.spot:hover img{transform:scale(1.04)}
.spot .tx{position:absolute;inset:auto 0 0 0;padding:28px 20px 22px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0))}
.spot .tx small{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.spot .tx h3{font-family:var(--serif);font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:4px 0 12px}
.spot .tx b{display:inline-block;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid #fff;font-weight:500}

/* full banner */
.fb{display:block;position:relative;background:var(--ink)}
.fb img{width:100%;height:auto}

/* reviews */
.rv{background:var(--cream2)}
.rvtop{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:24px;text-align:center}
.rvtop .big{font-family:var(--serif);font-size:64px;line-height:1}
.st{letter-spacing:3px;font-size:16px}
.rvtop small{color:var(--muted);font-size:13px}
.rc{flex:0 0 80%;max-width:330px;scroll-snap-align:start;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column}
@media(min-width:990px){.rc{flex-basis:calc(25% - 15px);max-width:none}}
.rc img{aspect-ratio:1;width:100%;object-fit:cover;background:var(--cream)}
.rc .b{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;font-size:14px}
.rc .n{margin-top:auto;font-weight:600;font-size:13px}
.rc .n span{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.rc .pp{font-size:11.5px;color:var(--muted)}

/* reels */
.reel{flex:0 0 74%;max-width:330px;scroll-snap-align:start;border:1px solid var(--line);background:#fff}
@media(min-width:990px){.reel{flex-basis:calc(25% - 15px);max-width:none}}
.reel iframe{width:100%;height:540px;border:0;display:block}
.reel a{display:block;text-align:center;padding:11px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--cream);font-weight:600}

/* story */
.story{background:var(--ink);color:var(--cream);text-align:center}
.story h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,6vw,46px);line-height:1.15;max-width:820px;margin:0 auto}
.story p{max-width:640px;margin:16px auto 24px;color:#cfc9bd}
.stats{display:flex;justify-content:center;gap:28px;margin:26px 0;flex-wrap:wrap}
.stats b{display:block;font-family:var(--serif);font-size:38px;font-weight:500;line-height:1}
.stats span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#bdb7ab}

/* footer */
footer{background:var(--cream);padding:48px 0 0;font-size:14px}
.fg{display:grid;gap:28px}
@media(min-width:990px){.fg{grid-template-columns:1.3fr 1fr 1fr 1.3fr;gap:40px}}
footer h4{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;font-weight:600}
footer ul{list-style:none;display:grid;gap:9px;color:var(--ink2)}
footer a:hover{text-decoration:underline}
.soc{display:flex;gap:10px;margin-top:14px}
.soc a{width:40px;height:40px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.soc svg{width:18px;height:18px;fill:var(--ink)}
.pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pay img{height:28px;width:auto;background:#fff;padding:4px 6px;border:1px solid var(--line)}
.fb2{margin-top:40px;border-top:1px solid var(--line);padding:16px 0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* collection page */
.ch{background:var(--cream);text-align:center;padding:34px 16px 28px}
.ch h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,7vw,52px);line-height:1.1}
.bc{font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.06em}
.ch p{color:var(--muted);font-size:13px;margin-top:6px}
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:22px;background:var(--paper)}
@media(min-width:990px){.tb{position:sticky;top:131px;z-index:20}}
.tb .cnt{font-size:12.5px;color:var(--muted)}
.tb select{border:1px solid var(--line);padding:9px 10px;background:var(--paper);font-size:13px;max-width:52%}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px 0 0}
.fchips::-webkit-scrollbar{display:none}
.fchips a,.fchips button{flex:0 0 auto;font-size:12px;letter-spacing:.06em;padding:8px 14px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;background:var(--paper)}
.fchips .on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.empty{text-align:center;padding:60px 0;color:var(--muted)}
.onstore{text-align:center;margin-top:34px;font-size:13px;color:var(--muted)}
.onstore a{color:var(--ink);text-decoration:underline}

/* product page */
.pdp{display:grid;gap:20px;padding:0 0 40px}
@media(min-width:990px){.pdp{grid-template-columns:1.15fr 1fr;gap:56px;padding:30px 0 60px}}
.gal{position:relative}
.gs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--cream)}
.gs::-webkit-scrollbar{display:none}
.gs img{flex:0 0 100%;scroll-snap-align:start;width:100%;aspect-ratio:3/4;object-fit:cover}
@media(min-width:990px){.gal{margin:0}.gs{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible;background:none}.gs img{flex:none}.gs img:first-child{grid-column:1/-1}.gal .dots{display:none}}
.gal .dots{bottom:12px}
.info{padding:0 16px}
@media(min-width:990px){.info{padding:0;position:sticky;top:150px;align-self:start}}
.info .bc{margin:4px 0 10px}
.info h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,6vw,36px);line-height:1.15}
.info .rt{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0;color:var(--ink2)}
.info .pr{font-size:22px;margin:6px 0 2px}
.info .pr s{font-size:15px}
.info .pr em{background:var(--ink);color:var(--cream);padding:3px 8px;font-size:11px}
.tax{font-size:12px;color:var(--muted)}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.lbl a{text-transform:none;letter-spacing:0;font-weight:400;text-decoration:underline;font-size:12.5px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{min-width:54px;height:44px;border:1px solid var(--line);padding:0 12px;font-size:13.5px;font-weight:500}
.sizes button.on{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.sizes button:hover{border-color:var(--ink)}
.acts{display:grid;gap:10px;margin:22px 0 10px}
.acts .btn{width:100%}
.note{font-size:12.5px;color:#9a2b2b;min-height:18px}
.perks{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0}
.perks div{background:var(--paper);padding:12px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:16px 0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:'+';font-size:20px;font-weight:300}
.acc details[open] summary::after{content:'–'}
.acc .ab{padding:0 0 16px;font-size:14px;color:var(--ink2)}
.acc .ab li{margin-left:18px;margin-bottom:4px}
/* sticky buy bar (mobile pdp) */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
.sbar .btn{flex:1;height:48px;padding:0 10px}
@media(min-width:990px){.sbar{display:none}}

/* mobile bottom nav (site-wide) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.bnav svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.5}
.bnav a.on{font-weight:600}
@media(min-width:990px){.bnav{display:none}}
body.pdpmode .bnav{display:none}

.wa{position:fixed;right:16px;bottom:78px;z-index:46;width:52px;height:52px;border-radius:50%;background:var(--ink);display:none;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.wa svg{width:26px;height:26px;fill:var(--cream)}
@media(min-width:990px){.wa{display:grid;bottom:24px;right:24px;width:58px;height:58px}}
body.pdpmode .wa{bottom:86px}

/* search */
.sbox{display:flex;border:1px solid var(--ink);margin:20px 0}
.sbox input{flex:1;border:0;padding:14px;font-size:16px;outline:none;background:transparent}
.sbox button{padding:0 18px}

/* simple pages */
.pg{max-width:820px;margin:0 auto;padding:30px 16px 60px}
.pg h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:26px 0 10px}
.pg p,.pg li{color:var(--ink2);margin-bottom:10px}
.pg ul{margin-left:18px}
.cards{display:grid;gap:12px;margin-top:18px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.cards a{border:1px solid var(--line);padding:20px;display:block}
.cards a b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
img.nf{opacity:0}

/* ===== trust additions ===== */

.eta b{display:block;font-size:13.5px}.eta span{font-size:12.5px;color:var(--ink2)}

.modal.open{display:flex}

.mbox{background:#fff;width:100%;max-width:520px;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:15px}
.sct{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}.sct th,.sct td{border:1px solid var(--line);padding:8px;text-align:center}.sct th{background:var(--cream)}

.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}

.ti{background:#fff;padding:18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}

.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 10px;margin-top:26px;text-align:center}
@media(min-width:990px){.nums{grid-template-columns:repeat(4,1fr)}}

.nums span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.pk{display:grid;gap:24px;align-items:center}

/* ---------- product card ---------- */
function card(p){
 const o=off(p),so=!p.sz.length;
 const b=[];if(so)b.push('<span class="so">Sold out</span>');else{if(o)b.push(`<span class="d">${o}% OFF</span>`)}
 const sizes=p.sz.slice(0,6).map(z=>`<i>${esc(z.s)}</i>`).join('')+(p.sz.length>6?`<i>+${p.sz.length-6}</i>`:'');
 return `<article class="pc"><a class="im" href="#/products/${p.h}" aria-label="${esc(p.t)}"><div class="bdg">${b.join('')}</div>
 ${img(p.im[0],'(min-width:990px) 25vw, 50vw','a',p.t,false,p.im.slice(1))}${p.im[1]?img(p.im[1],'(min-width:990px) 25vw, 50vw','b','',false,[]):''}</a>
 ${so?'':'<div class="ship">⚡ Ships in 24 hrs</div>'}<h3><a href="#/products/${p.h}">${esc(p.t)}</a></h3>
 <div class="pr">${rs(p.p)}${o?`<s>${rs(p.c)}</s>`:''}</div>
 <div class="szs">${sizes||'<i>Sold out</i>'}</div>
 <a class="cta" href="#/products/${p.h}">${so?'View details':'Choose options'}</a></article>`}
function rail(list,id){return `<div class="rwrap"><button class="harr prev" aria-label="Previous" onclick="scr('${id}',-1)">${IC.l}</button><div class="rail" id="${id}">${list.map(card).join('')}</div><button class="harr next" aria-label="Next" onclick="scr('${id}',1)">${IC.r}</button></div>`}
window.scr=(id,d)=>{const el=document.getElementById(id);el.scrollBy({left:d*el.clientWidth*.9,behavior:'smooth'})};

function banners(){return `<section class="bnr"><div class="bgrid">${['festive','kashmiri'].map(k=>{const e=EDITS[k];return `<a class="bn" href="#/collections/${e.key}"><img src="${e.img}" alt="${esc(e.t)}" loading="lazy"><div class="bt"><small>${e.eye}</small><h3>${esc(e.t)}</h3><span class="sn">Shop now</span></div></a>`}).join('')}</div></section>`}
function edit(k){const e=EDITS[k];const l=inCol(e.key).filter(p=>p.sz.length).slice(0,8);
 return `<section class="sec edit${e.rev?' rev':''}"><div class="wrap ed"><a class="edimg" href="#/collections/${e.key}"><img src="${e.img}" alt="${esc(e.t)}" loading="lazy"></a>

 <div class="edr">${rail(l,'ed-'+k)}</div>
 <a class="btn o" href="#/collections/${e.key}">Shop the collection</a></div></div></section>`}
function trustBlock(){
 const items=[[IC.lock,'Secure payments','UPI, cards & wallets via Shopify checkout'],[IC.truck,'Dispatch in 24 hours','Tracking shared on every order'],['<b class="tg">₹0</b>','Free shipping in India','No hidden delivery charges'],['<b class="tg">🌏</b>','Worldwide shipping','Free over $100 USD'],['<b class="tg">✋</b>','Real hand embroidery','Finished by skilled artisans'],[IC.wa,'Real people, real help','Talk to us on WhatsApp']];
 const nums=[['4.94★','84 verified reviews'],['14K+','Instagram family'],[ph(INFO.ordersShipped,'Orders shipped'),'Orders shipped'],[ph(INFO.countries,'Countries'),'Countries delivered']].filter(n=>n[0]);
 return `<section class="sec trust"><div class="wrap"><div class="sh"><h2>Why Shop With AYDEE</h2><p>Shop with confidence — here's our promise to you</p></div>
 <div class="tgrid">${items.map(i=>`<div class="ti"><span class="tic">${i[0]}</span><b>${i[1]}</b><small>${i[2]}</small></div>`).join('')}</div>
 <div class="nums">${nums.map(n=>`<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}</div></div></section>`}
